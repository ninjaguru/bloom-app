<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Staff — Bloom at Home</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f0f13;
      --surface: #1a1a23;
      --border: #2a2a3a;
      --text: #e8e8f0;
      --muted: #8888a0;
      --accent: #ec4899;
      --accent-glow: rgba(236,72,153,0.2);
      --gold: #f59e0b;
      --green: #34d399;
      --red: #f87171;
      --radius: 16px;
      --radius-sm: 12px;
    }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
    }
    .staff-header {
      position: sticky; top: 0; z-index: 10;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
      display: flex; align-items: center; justify-content: space-between;
      backdrop-filter: blur(12px);
    }
    .staff-header h1 { font-family: 'Outfit', sans-serif; font-size: 1.1rem; font-weight: 700; }
    .staff-header h1 span { color: var(--accent); }
    .staff-date { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
    .staff-badge { font-size: 0.7rem; font-weight: 600; padding: 4px 10px; border-radius: 100px; background: var(--accent-glow); color: var(--accent); border: 1px solid rgba(236,72,153,0.3); }
    .login-screen {
      display: flex; align-items: center; justify-content: center;
      min-height: 100dvh; padding: 24px;
    }
    .login-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 32px 24px; width: 100%; max-width: 360px;
    }
    .login-card h2 { font-family: 'Outfit', sans-serif; font-size: 1.3rem; margin-bottom: 4px; }
    .login-card p { font-size: 0.82rem; color: var(--muted); margin-bottom: 20px; }
    .login-input {
      width: 100%; padding: 12px 16px; border-radius: var(--radius-sm);
      background: var(--bg); border: 1px solid var(--border); color: var(--text);
      font-size: 1rem; outline: none; transition: border-color 0.2s;
      margin-bottom: 12px;
    }
    .login-input:focus { border-color: var(--accent); }
    .login-btn {
      width: 100%; padding: 12px; border: none; border-radius: var(--radius-sm);
      background: var(--accent); color: #fff; font-size: 0.95rem; font-weight: 600;
      cursor: pointer; transition: opacity 0.2s;
    }
    .login-btn:disabled { opacity: 0.5; }
    .login-error { font-size: 0.78rem; color: var(--red); margin-bottom: 12px; display: none; }
    .login-screen.hidden, .dashboard.hidden { display: none; }
    .dashboard { padding: 16px 20px 80px; max-width: 560px; margin: 0 auto; }
    .stats-row {
      display: flex; gap: 10px; margin-bottom: 20px;
    }
    .stat-chip {
      flex: 1; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 14px; text-align: center;
    }
    .stat-chip .num { font-size: 1.5rem; font-weight: 700; font-family: 'Outfit', sans-serif; }
    .stat-chip .lbl { font-size: 0.7rem; color: var(--muted); margin-top: 2px; }
    .section-title {
      font-family: 'Outfit', sans-serif; font-size: 0.85rem; font-weight: 600;
      color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em;
      margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
    }
    .booking-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px; margin-bottom: 12px;
    }
    .booking-card .top-row {
      display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px;
    }
    .booking-card .customer-name { font-weight: 600; font-size: 0.95rem; }
    .booking-card .customer-info { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
    .booking-card .time-badge {
      font-size: 0.72rem; font-weight: 600; padding: 4px 10px;
      border-radius: 100px; background: rgba(236,72,153,0.15); color: var(--accent);
      border: 1px solid rgba(236,72,153,0.25);
    }
    .booking-card .services { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .booking-card .service-tag {
      font-size: 0.72rem; padding: 4px 10px; border-radius: 100px;
      background: var(--bg); border: 1px solid var(--border); color: var(--text);
    }
    .booking-card .address { font-size: 0.78rem; color: var(--muted); margin-bottom: 12px; }
    .status-select {
      width: 100%; padding: 10px; border-radius: var(--radius-sm);
      background: var(--bg); border: 1px solid var(--border); color: var(--text);
      font-size: 0.82rem; font-weight: 500; outline: none;
    }
    .status-select option { background: var(--surface); }
    .loading { text-align: center; padding: 40px 0; color: var(--muted); }
    .empty-state { text-align: center; padding: 40px 0; }
    .empty-state .emoji { font-size: 2.5rem; margin-bottom: 12px; }
    .empty-state p { color: var(--muted); font-size: 0.85rem; }
    .signout-link {
      font-size: 0.75rem; color: var(--muted); cursor: pointer; text-decoration: underline;
      display: inline-block; margin-top: 20px;
    }
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: var(--surface); border: 1px solid var(--green); color: var(--green);
      padding: 12px 20px; border-radius: var(--radius-sm); font-size: 0.82rem; font-weight: 500;
      z-index: 100; display: none; animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateX(-50%) translateY(10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
  </style>
</head>
<body>
  <!-- Login Screen -->
  <div class="login-screen" id="login-screen">
    <div class="login-card">
      <h2>Bloom <span style="color:var(--accent)">Staff</span></h2>
      <p>Enter your registered phone number to view today's schedule.</p>
      <p class="login-error" id="login-error"></p>
      <input class="login-input" id="staff-phone" type="tel" placeholder="10-digit mobile number" maxlength="10" inputmode="numeric" />
      <button class="login-btn" id="login-btn">View My Schedule</button>
    </div>
  </div>

  <!-- Dashboard -->
  <div class="dashboard hidden" id="dashboard">
    <div class="staff-header">
      <div>
        <h1>Bloom <span>Staff</span></h1>
        <div class="staff-date" id="staff-date"></div>
      </div>
      <div>
        <span class="staff-badge" id="staff-name-badge">—</span>
      </div>
    </div>

    <div class="stats-row" id="stats-row">
      <div class="stat-chip">
        <div class="num" id="stat-today">0</div>
        <div class="lbl">Today</div>
      </div>
      <div class="stat-chip">
        <div class="num" id="stat-upcoming">0</div>
        <div class="lbl">Upcoming</div>
      </div>
      <div class="stat-chip">
        <div class="num" id="stat-earnings">₹0</div>
        <div class="lbl">Earnings</div>
      </div>
    </div>

    <div id="content-area">
      <div class="loading">Loading your schedule…</div>
    </div>

    <a class="signout-link" id="signout-link">Sign out</a>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module" src="/src/staff.js"></script>
</body>
</html>
